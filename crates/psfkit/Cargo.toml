[package]
name = "psfkit"
description = "Reader for Cadence Spectre PSF simulation results (psfbin, psfascii, psfxl)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
memmap2.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }
blosc-src = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["parallel", "psfxl"]
parallel = ["dep:rayon"]
# PSFXL (ngpsf) data files; builds bundled c-blosc
psfxl = ["dep:blosc-src"]
