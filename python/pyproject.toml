[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "polars-psf"
description = "Fast reader for Cadence Spectre PSF simulation results (psfbin, psfascii, PSFXL) to Polars"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "../README.md"
dependencies = ["polars>=1.40", "polars-waveform>=0.1"]  # polars: io plugins; tested 1.40-1.44
dynamic = ["version"]
keywords = ["spectre", "psf", "cadence", "simulation", "polars", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/henjo/polars-psf"
Issues = "https://github.com/henjo/polars-psf/issues"

[project.scripts]
polars-psf = "polars_psf.cli:main"

[project.optional-dependencies]
# compat (libpsf API), Waveform.to_numpy and dft()
numpy = ["numpy"]
test = ["pytest", "numpy", "pyarrow"]

[tool.uv.sources]
# until polars-waveform is on PyPI; for local work on both: uv pip install -e ../../polars-waveform
polars-waveform = { git = "https://github.com/henjo/polars-waveform", tag = "v0.1.0" }

[dependency-groups]
# marimo notebooks in examples/: uv run --group examples marimo edit examples/tour.py
examples = ["marimo", "altair>=5.4", "numpy"]

[tool.maturin]
module-name = "polars_psf._polars_psf"
python-source = "."
features = []
# NFS keeps deleted-but-open files as .nfs* placeholders; never ship them
exclude = ["polars_psf/.nfs*"]

[tool.ruff]
line-length = 120
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# Ω, × and − in docs and labels are intended; __all__ follows the docs order
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["B018", "E501", "RUF022"]  # marimo cells end in bare expressions
