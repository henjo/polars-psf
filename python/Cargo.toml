[package]
name = "polars-psf-python"
description = "Python bindings of psfkit for polars-psf (PSF simulation results -> Arrow/Polars)"
version.workspace = true
edition.workspace = true
license.workspace = true
# arrow dependencies need let-chains (1.88)
rust-version = "1.88"
repository.workspace = true
publish = false

[lib]
name = "_polars_psf"
crate-type = ["cdylib"]

[dependencies]
psfkit.workspace = true
psfkit-arrow.workspace = true
psfkit-results.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
rayon.workspace = true
pyo3 = { workspace = true, features = ["abi3-py311"] }
pyo3-arrow.workspace = true
