name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: test (psfkit without default features)
        run: cargo test -p psfkit --no-default-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check -p psfkit -p psfkit-results --all-targets
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets

  wheels:
    name: Wheel (${{ matrix.platform.os }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }  # macos-13 runners are retired
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  test-wheels:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pyarrow
          python -m pip install "polars-waveform @ git+https://github.com/henjo/polars-waveform@v0.1.0"
          python -m pip install --no-index --find-links dist polars-psf --no-deps
          python -m pip install polars
      - name: pytest
        run: python -m pytest -q python/tests
      - name: examples
        shell: bash
        env:
          PYTHONUTF8: "1"  # Polars tables print box-drawing characters; Windows defaults to cp1252
        run: |
          python python/examples/post_processing.py
          python python/examples/corner_report.py
          python python/examples/noise_queries.py testdata/pycircuit/psf/pnoise0.pnoise

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff check python
      - name: marimo check
        run: uvx marimo check python/examples/tour.py python/examples/waveform.py

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: GitHub Release (wheels + sdist)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, msrv, test-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    name: Publish to PyPI
    # polars-waveform must be on PyPI first (polars-psf requires it)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polars-psf
    permissions:
      id-token: write # trusted publishing, no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
